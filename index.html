<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HD 프로젝트 대시보드</title>
    <!-- 나눔고딕 폰트 적용 -->
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        /* 컬러 팔레트: 다크그린(#1B4332), 샌드베이지(#F2E9E4), 소프트골드(#D4A373) */
        :root {
            --dark-green: #1B4332;
            --sand-beige: #F2E9E4;
            --soft-gold: #D4A373;
        }

        body {
            font-family: 'Nanum Gothic', sans-serif;
            background-color: var(--sand-beige);
            color: var(--dark-green);
            margin: 0;
            padding: 20px;
        }

        header {
            background-color: var(--dark-green);
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        a {
            color: var(--soft-gold);
            font-weight: bold;
            text-decoration: none;
        }

        /* 간트차트 및 진행바 스타일 */
        .gantt-chart { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .gantt-chart th, .gantt-chart td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        .progress-bar-bg { background: #eee; width: 100%; height: 20px; border-radius: 10px; }
        .progress-bar-fill { background: var(--dark-green); height: 100%; border-radius: 10px; transition: width 0.5s; }
    </style>
</head>
<body>

<header>
    <h1>HD 프로젝트 팀 대시보드</h1>
    <p>30명과 함께하는 성공적인 프로젝트 관리를 위해</p>
</header>

<div class="container">
    <!-- 구글 문서 및 폴더 안내 -->
    <div class="card">
        <h2>공유 자료 및 회의록</h2>
        <p>프로젝트 회의록: <a href="https://docs.google.com/document/d/1jWdQ-jVno0jmseKnzJdQ7OwRvXtp3YUsdsx5vKOTdHI/edit?usp=sharing" target="_blank">구글 문서 바로가기</a></p>
        <p>파일 공유 드라이브: <a href="https://drive.google.com/drive/folders/1a1sIIchtB9inxF4-0BX4MLEe8VBxiao5?usp=sharing" target="_blank">공유 폴더 열기</a></p>
        <p><em>안내: 위 드라이브 폴더에 파일을 업로드하거나 필요한 자료를 다운로드하세요.</em></p>
    </div>

    <!-- 간트차트 및 진행율 -->
    <div class="card">
        <h2>일정 및 진행 현황</h2>
        <table class="gantt-chart">
            <tr><th>작업 항목</th><th>진행률</th></tr>
            <tr><td>기획 및 설계</td><td>
                <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: 80%;"></div></div>
            </td></tr>
            <tr><td>개발 및 구현</td><td>
                <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: 40%;"></div></div>
            </td></tr>
        </table>
    </div>
</div>

<script>
    // 향후 수정보완을 위한 자바스크립트 영역
    console.log("HD 프로젝트 대시보드가 로드되었습니다.");
    // 추가적인 상호작용 효과를 여기에 구현하세요.
</script>

</body>
</html>
